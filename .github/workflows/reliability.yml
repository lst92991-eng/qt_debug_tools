name: Reliability
on:
  push:
    branches: [fix/reliability-pass-20260905]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev qt6-serialport-dev libusb-1.0-0-dev
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify multi-config layout
        run: |
          cmake -S . -B build-multi -G "Ninja Multi-Config" -DBUILD_TESTING=ON
          cmake --build build-multi --config Release --parallel 2
          ctest --test-dir build-multi -C Release --output-on-failure
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt" --modules qtserialport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "QT_ROOT=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" >> $env:GITHUB_ENV
          "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" >> $env:GITHUB_PATH
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2
          exit $LASTEXITCODE
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
